name: edusafe_flutter
description: EduSafe academic data security app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  file_picker: ^10.3.10
  path_provider: ^2.1.6
  cryptography: ^2.9.0
  crypto: ^3.0.8
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
